### ============================================================
### Qwen2.5-VL-7B QLoRA Fine-Tuning Config for LLaMA-Factory
### Pavement Distress Classification (GAPs + RDD combined)
###
### Hardware: NVIDIA RTX A5000 (24 GB VRAM)
### Expected training time: ~12-24 hours
### Effective batch size: 4 * 8 = 32
###
### BEFORE RUNNING:
###   1. python scripts/preflight_dataset.py     # MUST pass — catches broken JPEGs
###   2. python scripts/05_setup_training_config.py  # auto-fills dataset_dir, output_dir
###   3. Set env: PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True,max_split_size_mb:512
###   4. Disable Windows Update auto-reboot (see SETUP.md)
###   5. python -m llamafactory.cli train configs/qwen25vl_qlora_sft.yaml
###
### Recovery: pass --resume_from_checkpoint outputs/.../checkpoint-XXXX
### ============================================================

### Model
model_name_or_path: Qwen/Qwen2.5-VL-7B-Instruct
trust_remote_code: true

### Method
stage: sft
do_train: true
finetuning_type: lora
lora_target: all
lora_rank: 64
lora_alpha: 128
lora_dropout: 0.1

### Quantization (QLoRA - 4-bit NF4)
quantization_bit: 4
quantization_method: bitsandbytes

### Dataset
### >>> Auto-filled by scripts/05_setup_training_config.py <<<
dataset_dir: C:/Users/PRO-LAB-3/Documents/Capstone/data
dataset: combined_train
eval_dataset: combined_valid
template: qwen2_5_vl
cutoff_len: 2048
overwrite_cache: true
# Windows-safe worker count — 8 caused PIL BadJpegData warnings under file-handle contention
preprocessing_num_workers: 4

### Image-token caps for Qwen2.5-VL processor
### Critical for VRAM safety — phone photos at 4032x3024 generate 15k+ visual tokens
### and OOM the A5000 mid-training. 256 tokens (256*28*28 = 200,704 px) is the
### official Qwen2.5-VL fine-tuning recommendation for consumer GPUs.
image_max_pixels: 200704
image_min_pixels: 50176

### Output
output_dir: C:/Users/PRO-LAB-3/Documents/Capstone/outputs/qwen25vl-qlora-gaps-rdd
logging_steps: 50
# Drop from 500 to 200 — Windows Update can wipe up to (save_steps * step_time)
# of work. With 200 we lose at most ~1.4h on a hard reboot vs ~3.5h before.
save_steps: 200
save_total_limit: 3
plot_loss: true
overwrite_output_dir: true

### Training hyperparameters
per_device_train_batch_size: 4
per_device_eval_batch_size: 4
gradient_accumulation_steps: 8
learning_rate: 1.0e-4
num_train_epochs: 2
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
# QLoRA-paper canonical value. Default is 1.0 which is borderline-unstable
# with rank-64 LoRA + alpha-128 (effective scaling factor 2.0). 0.3 is what
# Bavest/fin-llama and the original QLoRA paper use.
max_grad_norm: 0.3

### Reproducibility
seed: 42
data_seed: 42

### Evaluation + early stopping
eval_strategy: steps
eval_steps: 500
save_strategy: steps
# load_best_model_at_end: true would force save_steps to be a multiple of
# eval_steps (transformers constraint). With eval=500 that means save in
# {500, 1000, ...}, losing our Windows-Update-resilience save_steps=200.
# Doing eval every 200 steps would 3x total training time on a 15k valid set.
# Compromise: keep dense saves, disable auto-restore. After training, pick
# the best checkpoint by reading trainer_state.json's best_metric_*. The
# early-stopping callback below still works without load_best_model_at_end.
load_best_model_at_end: false
metric_for_best_model: eval_loss
greater_is_better: false
# NOTE: early_stopping_patience / early_stopping_threshold are NOT valid
# LLaMA-Factory YAML keys (HfArgumentParser rejects them). The early-stopping
# callback is registered programmatically by scripts/train_qlora.py instead.

### Regularization (anti-overfit stack)
weight_decay: 0.05
# Dropped from 0.1 — softens structured-output target distribution and
# hurts exact-match parsing on "DISTRESS_TYPES: ..." responses.
label_smoothing_factor: 0.05
neftune_noise_alpha: 5.0

### Freeze vision tower (standard for VLM LoRA fine-tuning)
freeze_vision_tower: true

### Performance & Acceleration
flash_attn: fa2
# CRITICAL: Liger Kernel patches linear layers that QLoRA needs to adapt.
# With quantization_bit=4, Liger either errors at startup or silently
# disables itself. Per LLaMA-Factory FAQ — incompatible with QLoRA.
enable_liger_kernel: false
gradient_checkpointing: true
optim: adamw_8bit
ddp_timeout: 1800
report_to: none
