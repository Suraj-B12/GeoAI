### ============================================================
### Qwen2.5-VL-7B QLoRA Fine-Tuning Config for LLaMA-Factory
### Pavement Distress Classification (GAPs + RDD combined)
###
### Hardware: NVIDIA RTX A5000 (24 GB VRAM)
### Expected training time: ~12-24 hours
### Effective batch size: 4 * 8 = 32
###
### BEFORE RUNNING:
###   1. python scripts/preflight_dataset.py     # MUST pass — catches broken JPEGs
###   2. python scripts/05_setup_training_config.py  # auto-fills dataset_dir, output_dir
###   3. Set env: PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True,max_split_size_mb:512
###   4. Disable Windows Update auto-reboot (see SETUP.md)
###   5. python -m llamafactory.cli train configs/qwen25vl_qlora_sft.yaml
###
### Recovery: pass --resume_from_checkpoint outputs/.../checkpoint-XXXX
### ============================================================

### Model
model_name_or_path: Qwen/Qwen2.5-VL-7B-Instruct
trust_remote_code: true

### Method
stage: sft
do_train: true
finetuning_type: lora
lora_target: all
# Halved from 64 -> 32 after empirical OOM at step 9 (first optimizer step).
# 161M trainable params × adamw state was pushing 23.5/24 GB usage. Rank 32
# gives ~80M trainable params. lora_alpha kept at 2*rank for same effective
# scaling factor (2.0). For domain-specific QLoRA on a 7B base, rank 32
# is the canonical recipe; rank 64 is luxury.
lora_rank: 32
lora_alpha: 64
lora_dropout: 0.1

### Quantization (QLoRA - 4-bit NF4)
quantization_bit: 4
quantization_method: bitsandbytes

### Dataset
### >>> Auto-filled by scripts/05_setup_training_config.py <<<
dataset_dir: C:/Users/PRO-LAB-3/Documents/Capstone/data
dataset: combined_train
eval_dataset: combined_valid
# Current LLaMA-Factory unified Qwen2-VL and Qwen2.5-VL under one template
# (same chat format + <|image_pad|> token). 'qwen2_5_vl' was a separate
# template in older LF versions but no longer exists.
template: qwen2_vl
# Stage 1 responses are "Normal"/"Distress" (1 token), Stage 2 responses
# are ~150 tokens of structured output. Plus image tokens (capped below).
# 2048 was OVERKILL and pushed activation memory into thrashing territory
# (steps 9+ ballooned from 28s to 400+s/it on A5000 24GB). 1024 is plenty.
cutoff_len: 1024
overwrite_cache: true
# Windows-safe worker count — 8 caused PIL BadJpegData warnings under file-handle contention
preprocessing_num_workers: 4

### Image-token caps for Qwen2.5-VL processor
### Dropped further (256 -> 128 vision tokens) after empirical activation
### thrashing at the original cap. Combined with cutoff_len 1024, total
### sequence per sample is ~256-300 tokens vs 2304 before — 8x reduction
### in attention memory.
image_max_pixels: 100352          # 128*28*28 = 100,352 px (128 vision tokens)
image_min_pixels: 50176           # 64*28*28 = 50,176 px floor

### Output
output_dir: C:/Users/PRO-LAB-3/Documents/Capstone/outputs/qwen25vl-qlora-gaps-rdd
# Lowered from 50 -> 20 so the heartbeat updates ~3x more often (visibility
# during slow training steps and faster feedback when something goes wrong).
logging_steps: 20
# Drop from 500 to 200 — Windows Update can wipe up to (save_steps * step_time)
# of work. With 200 we lose at most ~1.4h on a hard reboot vs ~3.5h before.
save_steps: 200
save_total_limit: 3
plot_loss: true
overwrite_output_dir: true

### Training hyperparameters
# Per-device batch ratchet: 4 -> 2 -> 1 over three failed runs.
# - At 4: OOM at step 1 (label_smoother log_softmax)
# - At 2: OOM at step 9 (first paged_adamw_8bit lazy state allocation)
# - At 1: per-batch activations are minimum possible. Optimizer state
#   has room to allocate. Effective batch stays at 32 via grad_accum=32.
# This is the canonical QLoRA-on-24GB recipe for 7B+ multimodal models.
per_device_train_batch_size: 1
per_device_eval_batch_size: 1
gradient_accumulation_steps: 32
# Empty CUDA allocator cache every 4 optimizer steps. Stops the slow
# fragmentation-degradation pattern observed (steps 1-16 at 22s, then
# steps 17-25 ballooning to 330s/it). Adds ~0.5s per fired interval but
# keeps step times consistent through the full 4806 steps.
torch_empty_cache_steps: 4
learning_rate: 1.0e-4
num_train_epochs: 2
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
# QLoRA-paper canonical value. Default is 1.0 which is borderline-unstable
# with rank-64 LoRA + alpha-128 (effective scaling factor 2.0). 0.3 is what
# Bavest/fin-llama and the original QLoRA paper use.
max_grad_norm: 0.3

### Reproducibility
seed: 42
data_seed: 42

### Evaluation + early stopping
eval_strategy: steps
eval_steps: 500
save_strategy: steps
# load_best_model_at_end: true would force save_steps to be a multiple of
# eval_steps (transformers constraint). With eval=500 that means save in
# {500, 1000, ...}, losing our Windows-Update-resilience save_steps=200.
# Doing eval every 200 steps would 3x total training time on a 15k valid set.
# Compromise: keep dense saves, disable auto-restore. After training, pick
# the best checkpoint by reading trainer_state.json's best_metric_*. The
# early-stopping callback below still works without load_best_model_at_end.
load_best_model_at_end: false
metric_for_best_model: eval_loss
greater_is_better: false
# NOTE: early_stopping_patience / early_stopping_threshold are NOT valid
# LLaMA-Factory YAML keys (HfArgumentParser rejects them). The early-stopping
# callback is registered programmatically by scripts/train_qlora.py instead.

### Regularization (anti-overfit stack)
weight_decay: 0.05
# label_smoothing_factor materializes -log_softmax(logits) which is
# [batch * seq * vocab=152k * fp32] ~= 5GB — directly caused the original
# OOM at step 1. Set to 0 to fall back to standard cross_entropy
# (in-place / fused, ~10x less peak memory). Slight regularization loss
# acceptable; weight_decay + lora_dropout + NEFTune still active.
label_smoothing_factor: 0.0
neftune_noise_alpha: 5.0

### Freeze vision tower (standard for VLM LoRA fine-tuning)
freeze_vision_tower: true

### Performance & Acceleration
flash_attn: fa2
# CRITICAL: Liger Kernel patches linear layers that QLoRA needs to adapt.
# With quantization_bit=4, Liger either errors at startup or silently
# disables itself. Per LLaMA-Factory FAQ — incompatible with QLoRA.
enable_liger_kernel: false
gradient_checkpointing: true
# paged_adamw_8bit pages optimizer state to CPU memory when VRAM is tight.
# This is the canonical QLoRA paper optimizer for 24GB-and-below GPUs.
# Speed cost ~5%, VRAM savings ~30%.
optim: paged_adamw_8bit
ddp_timeout: 1800
report_to: none
